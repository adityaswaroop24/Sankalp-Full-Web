<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Reports | Sankalp</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Inter", sans-serif;
            background: #f5f6f8;
            color: #111827;
            min-height: 100vh;
        }

        .navbar {
            height: 72px;
            background: white;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 7%;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-box {
            width: 38px;
            height: 38px;
            background: #f59e0b;
            border-radius: 9px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 800;
            color: #111827;
        }

        .logo strong {
            font-size: 18px;
            letter-spacing: 0.5px;
        }

        .back-link {
            font-size: 13px;
            font-weight: 600;
            color: #6b7280;
            text-decoration: none;
        }

        .back-link:hover {
            color: #d97706;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 45px 20px;
        }

        .heading {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 16px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .heading h1 {
            font-size: 26px;
            margin-bottom: 6px;
        }

        .heading p {
            color: #6b7280;
            font-size: 14px;
        }

        .cta-btn {
            background: #f59e0b;
            color: #111827;
            border: none;
            border-radius: 9px;
            padding: 12px 20px;
            font-family: inherit;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            white-space: nowrap;
        }

        .cta-btn:hover {
            background: #d97706;
            color: white;
        }

        .empty {
            background: white;
            border: 1px dashed #d1d5db;
            border-radius: 14px;
            padding: 50px 20px;
            text-align: center;
            color: #6b7280;
        }

        .report-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 22px;
            margin-bottom: 16px;
        }

        .report-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
            gap: 10px;
            flex-wrap: wrap;
        }

        .report-top h3 {
            font-size: 16px;
        }

        .report-date {
            font-size: 12px;
            color: #6b7280;
            font-weight: 600;
        }

        .report-detail {
            font-size: 13px;
            color: #4b5563;
            margin-bottom: 6px;
        }

        .report-summary {
            font-size: 13px;
            color: #374151;
            margin-top: 10px;
            line-height: 1.5;
        }

        .status-msg {
            font-size: 13px;
            color: #b91c1c;
        }

        .card-actions {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }

        .action-btn {
            flex: 1;
            border: 1px solid #d1d5db;
            background: white;
            border-radius: 8px;
            padding: 8px 0;
            font-family: inherit;
            font-size: 12px;
            font-weight: 700;
            color: #374151;
            cursor: pointer;
        }

        .action-btn.edit:hover {
            border-color: #f59e0b;
            color: #d97706;
        }

        .action-btn.delete:hover {
            border-color: #b91c1c;
            color: #b91c1c;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(17,24,39,0.5);
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 100;
        }

        .modal-overlay.visible {
            display: flex;
        }

        .modal-card {
            background: white;
            border-radius: 16px;
            padding: 28px;
            max-width: 480px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-card h2 {
            font-size: 18px;
            margin-bottom: 18px;
        }

        .field {
            margin-bottom: 16px;
        }

        .field label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #374151;
        }

        .field input, .field select, .field textarea {
            width: 100%;
            border: 1px solid #d1d5db;
            border-radius: 9px;
            padding: 11px 12px;
            font-family: inherit;
            font-size: 14px;
            outline: none;
        }

        .field textarea {
            min-height: 80px;
            resize: vertical;
        }

        .field input:focus, .field select:focus, .field textarea:focus {
            border-color: #f59e0b;
            box-shadow: 0 0 0 3px rgba(245,158,11,0.1);
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 8px;
        }

        .modal-cancel {
            flex: 1;
            border: 1px solid #d1d5db;
            background: white;
            border-radius: 9px;
            padding: 12px 0;
            font-family: inherit;
            font-size: 13px;
            font-weight: 700;
            color: #374151;
            cursor: pointer;
        }

        .modal-cancel:hover {
            background: #f9fafb;
        }

        .modal-save {
            flex: 1;
            border: none;
            border-radius: 9px;
            background: #f59e0b;
            color: #111827;
            padding: 12px 0;
            font-family: inherit;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
        }

        .modal-save:hover {
            background: #d97706;
            color: white;
        }

        @media (max-width: 560px) {
            .grid-2 {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 560px) {
            .navbar {
                padding: 14px 5%;
                height: auto;
                flex-wrap: wrap;
                gap: 10px;
            }
        }
    </style>
</head>

<body>

<nav class="navbar">
    <div class="logo">
        <div class="logo-box">S</div>
        <strong>SANKALP</strong>
    </div>

    <a class="back-link" href="professional-dashboard.html">← Back to Dashboard</a>
</nav>

<div class="container">

    <div class="heading">
        <div>
            <h1>My Reports</h1>
            <p>Every daily report you've submitted to homeowners.</p>
        </div>

        <a class="cta-btn" href="submit-report.html">+ Submit New Report</a>
    </div>

    <div id="reportsArea">Loading...</div>

</div>

<div class="modal-overlay" id="editModalOverlay">
    <div class="modal-card">
        <h2>Edit Report</h2>

        <div id="editStatus" class="status-msg" style="margin-bottom: 12px;"></div>

        <form id="editForm">
            <div class="field">
                <label>Project *</label>
                <select id="editProjectId" required>
                    <option value="">Loading projects...</option>
                </select>
            </div>

            <div class="grid-2">
                <div class="field">
                    <label>Report Date *</label>
                    <input type="date" id="editReportDate" required>
                </div>

                <div class="field">
                    <label>Days Elapsed So Far</label>
                    <input type="number" id="editDaysElapsed" min="0">
                </div>
            </div>

            <div class="field">
                <label>Amount Spent (₹) *</label>
                <input type="number" id="editAmountSpent" min="0" required>
            </div>

            <div class="field">
                <label>Work Summary *</label>
                <textarea id="editWorkSummary" required></textarea>
            </div>

            <div class="modal-actions">
                <button type="button" class="modal-cancel" id="editCancelBtn">Cancel</button>
                <button type="submit" class="modal-save">Save Changes</button>
            </div>
        </form>
    </div>
</div>

<script>

    const API_BASE = "https://sankalp-full-web.onrender.com/api";

    const user = JSON.parse(localStorage.getItem("user") || "null");
    const token = localStorage.getItem("token");

    if (!user || !token) {
        window.location.href = "login_page.html";
    } else if (user.role !== "Professional") {
        window.location.href = "login_page.html";
    }

    function formatDate(dateStr) {
        return new Date(dateStr).toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" });
    }

    async function loadReports() {
        const area = document.getElementById("reportsArea");

        try {
            const response = await fetch(`${API_BASE}/reports/mine`, {
                headers: { "Authorization": `Bearer ${token}` }
            });

            const data = await response.json();

            if (!response.ok || !data.success) {
                area.innerHTML = `<p class="status-msg">${data.message || "Failed to load reports."}</p>`;
                return;
            }

            if (data.reports.length === 0) {
                area.innerHTML = `<div class="empty"><p>You haven't submitted any reports yet.</p></div>`;
                return;
            }

            area.innerHTML = "";

            data.reports.forEach(report => {
                const card = document.createElement("div");
                card.className = "report-card";

                const top = document.createElement("div");
                top.className = "report-top";

                const title = document.createElement("h3");
                title.textContent = report.projectName;
                top.appendChild(title);

                const date = document.createElement("span");
                date.className = "report-date";
                date.textContent = formatDate(report.reportDate);
                top.appendChild(date);

                card.appendChild(top);

                [
                    `Customer: ${report.customerEmail || "-"}`,
                    `Amount spent: ₹${Number(report.amountSpent).toLocaleString("en-IN")}`,
                    report.daysElapsed !== null ? `Days elapsed: ${report.daysElapsed}` : null
                ].filter(Boolean).forEach(text => {
                    const detail = document.createElement("div");
                    detail.className = "report-detail";
                    detail.textContent = text;
                    card.appendChild(detail);
                });

                const summary = document.createElement("div");
                summary.className = "report-summary";
                summary.textContent = report.workSummary;
                card.appendChild(summary);

                const actions = document.createElement("div");
                actions.className = "card-actions";

                const editBtn = document.createElement("button");
                editBtn.className = "action-btn edit";
                editBtn.textContent = "Edit";
                editBtn.addEventListener("click", () => openEditModal(report));
                actions.appendChild(editBtn);

                const deleteBtn = document.createElement("button");
                deleteBtn.className = "action-btn delete";
                deleteBtn.textContent = "Delete";
                deleteBtn.addEventListener("click", () => deleteReport(report.id));
                actions.appendChild(deleteBtn);

                card.appendChild(actions);

                area.appendChild(card);
            });

        } catch (error) {
            console.error("Failed to load reports:", error);
            area.innerHTML = `<p class="status-msg">Could not reach the server.</p>`;
        }
    }

    let editingReportId = null;
    let cachedProjects = null;

    async function loadProjectsForEdit() {
        if (cachedProjects) {
            return cachedProjects;
        }

        try {
            const response = await fetch(`${API_BASE}/projects/all`, {
                headers: { "Authorization": `Bearer ${token}` }
            });

            const data = await response.json();

            cachedProjects = (response.ok && data.success) ? data.projects : [];

        } catch (error) {
            console.error("Failed to load projects:", error);
            cachedProjects = [];
        }

        return cachedProjects;
    }

    async function openEditModal(report) {
        editingReportId = report.id;

        const select = document.getElementById("editProjectId");
        const projects = await loadProjectsForEdit();

        if (projects.length === 0) {
            select.innerHTML = `<option value="">No projects available</option>`;
        } else {
            select.innerHTML = "";
            projects.forEach(project => {
                const option = document.createElement("option");
                option.value = project.id;
                option.textContent = `${project.project_name} — ${project.customer_name || project.email || "Unknown customer"} (${project.location})`;
                select.appendChild(option);
            });
        }

        select.value = report.projectId || "";

        document.getElementById("editReportDate").value = new Date(report.reportDate).toISOString().split("T")[0];
        document.getElementById("editDaysElapsed").value = report.daysElapsed !== null ? report.daysElapsed : "";
        document.getElementById("editAmountSpent").value = report.amountSpent || "";
        document.getElementById("editWorkSummary").value = report.workSummary || "";

        document.getElementById("editStatus").textContent = "";
        document.getElementById("editModalOverlay").classList.add("visible");
    }

    function closeEditModal() {
        editingReportId = null;
        document.getElementById("editModalOverlay").classList.remove("visible");
    }

    document.getElementById("editCancelBtn").addEventListener("click", closeEditModal);

    document.getElementById("editModalOverlay").addEventListener("click", (event) => {
        if (event.target.id === "editModalOverlay") {
            closeEditModal();
        }
    });

    document.getElementById("editForm").addEventListener("submit", async function(event) {
        event.preventDefault();

        const editStatus = document.getElementById("editStatus");

        const payload = {
            projectId: document.getElementById("editProjectId").value,
            reportDate: document.getElementById("editReportDate").value,
            daysElapsed: document.getElementById("editDaysElapsed").value || null,
            amountSpent: document.getElementById("editAmountSpent").value,
            workSummary: document.getElementById("editWorkSummary").value.trim()
        };

        if (!payload.projectId) {
            editStatus.textContent = "Please select a project.";
            return;
        }

        try {
            const response = await fetch(`${API_BASE}/reports/${editingReportId}`, {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${token}`
                },
                body: JSON.stringify(payload)
            });

            const data = await response.json();

            if (!response.ok || !data.success) {
                editStatus.textContent = data.message || "Failed to update report.";
                return;
            }

            closeEditModal();
            loadReports();

        } catch (error) {
            console.error("Update report failed:", error);
            editStatus.textContent = "Could not reach the server.";
        }
    });

    async function deleteReport(id) {
        if (!confirm("Delete this report? This cannot be undone.")) {
            return;
        }

        try {
            await fetch(`${API_BASE}/reports/${id}`, {
                method: "DELETE",
                headers: { "Authorization": `Bearer ${token}` }
            });
            loadReports();
        } catch (error) {
            console.error("Delete report failed:", error);
        }
    }

    loadReports();

</script>

</body>
</html>
