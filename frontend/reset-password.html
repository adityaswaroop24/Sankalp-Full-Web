<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | Sankalp</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Inter", sans-serif;
            background: #f5f6f8;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
        }

        .card {
            width: 100%;
            max-width: 440px;
            background: #ffffff;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.06);
        }

        .logo {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 28px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: #f59e0b;
            border-radius: 10px;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 20px;
            font-weight: 800;
            color: #111827;
        }

        .logo-text {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 1px;
            color: #111827;
        }

        h2 {
            font-size: 24px;
            color: #111827;
            margin-bottom: 8px;
            text-align: center;
        }

        p.subtitle {
            color: #6b7280;
            font-size: 14px;
            text-align: center;
            margin-bottom: 26px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            height: 50px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            padding: 0 16px;
            font-family: inherit;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
        }

        .form-input:focus {
            border-color: #f59e0b;
            box-shadow: 0 0 0 3px rgba(245,158,11,0.12);
        }

        .submit-btn {
            width: 100%;
            height: 52px;
            border: none;
            border-radius: 10px;
            background: #f59e0b;
            color: #111827;
            font-family: inherit;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.25s;
        }

        .submit-btn:hover {
            background: #d97706;
            color: white;
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .back-link {
            text-align: center;
            margin-top: 22px;
            font-size: 13px;
            color: #6b7280;
        }

        .back-link a {
            color: #d97706;
            font-weight: 700;
            text-decoration: none;
        }

        .message {
            display: none;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 18px;
            font-size: 13px;
            font-weight: 500;
        }

        .message.success {
            display: block;
            background: #ecfdf5;
            color: #047857;
            border: 1px solid #a7f3d0;
        }

        .message.error {
            display: block;
            background: #fef2f2;
            color: #b91c1c;
            border: 1px solid #fecaca;
        }
    </style>
</head>

<body>

<div class="card">

    <div class="logo">
        <div class="logo-icon">S</div>
        <div class="logo-text">SANKALP</div>
    </div>

    <h2>Set a new password</h2>
    <p class="subtitle" id="subtitle">Enter and confirm your new password below.</p>

    <div id="message" class="message"></div>

    <form id="resetForm">

        <div class="form-group">
            <label for="newPassword">New password</label>
            <input type="password" id="newPassword" class="form-input" placeholder="At least 6 characters" minlength="6" required>
        </div>

        <div class="form-group">
            <label for="confirmPassword">Confirm password</label>
            <input type="password" id="confirmPassword" class="form-input" placeholder="Re-enter new password" minlength="6" required>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">Reset Password</button>

    </form>

    <div class="back-link">
        <a href="login_page.html">Back to sign in</a>
    </div>

</div>

<script>

    const API_BASE = "http://127.0.0.1:5050/api";

    const params = new URLSearchParams(window.location.search);
    const token = params.get("token");

    function showMessage(text, type) {
        const message = document.getElementById("message");
        message.textContent = text;
        message.className = "message " + type;
    }

    if (!token) {
        showMessage("This reset link is missing its token. Please request a new one from the forgot password page.", "error");
        document.getElementById("resetForm").style.display = "none";
    }

    document
        .getElementById("resetForm")
        .addEventListener("submit", async function(event) {

            event.preventDefault();

            const newPassword = document.getElementById("newPassword").value;
            const confirmPassword = document.getElementById("confirmPassword").value;
            const submitBtn = document.getElementById("submitBtn");

            if (newPassword !== confirmPassword) {
                showMessage("Passwords do not match.", "error");
                return;
            }

            if (newPassword.length < 6) {
                showMessage("Password must be at least 6 characters.", "error");
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = "Resetting...";

            try {

                const response = await fetch(`${API_BASE}/auth/reset-password`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ token, newPassword })
                });

                const data = await response.json();

                if (!response.ok || !data.success) {
                    showMessage(data.message || "Failed to reset password.", "error");
                    submitBtn.disabled = false;
                    submitBtn.textContent = "Reset Password";
                    return;
                }

                showMessage("Password reset successfully! Redirecting to sign in...", "success");
                document.getElementById("resetForm").style.display = "none";

                setTimeout(() => {
                    window.location.href = "login_page.html";
                }, 1500);

            } catch (error) {
                console.error("Reset password request failed:", error);
                showMessage("Could not reach the server. Please try again.", "error");
                submitBtn.disabled = false;
                submitBtn.textContent = "Reset Password";
            }

        });

</script>

</body>
</html>
