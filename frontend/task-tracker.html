<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Task Tracker | Sankalp</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Inter", sans-serif;
            background: #f5f6f8;
            color: #111827;
            min-height: 100vh;
        }

        .navbar {
            height: 72px;
            background: white;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 7%;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-box {
            width: 38px;
            height: 38px;
            background: #f59e0b;
            border-radius: 9px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 800;
            color: #111827;
        }

        .logo strong {
            font-size: 18px;
            letter-spacing: 0.5px;
        }

        .back-link {
            font-size: 13px;
            font-weight: 600;
            color: #6b7280;
            text-decoration: none;
        }

        .back-link:hover {
            color: #d97706;
        }

        .container {
            max-width: 640px;
            margin: 0 auto;
            padding: 45px 20px;
        }

        .heading h1 {
            font-size: 26px;
            margin-bottom: 6px;
        }

        .heading p {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .add-form {
            display: flex;
            gap: 10px;
            margin-bottom: 26px;
        }

        .add-form input {
            flex: 1;
            border: 1px solid #d1d5db;
            border-radius: 9px;
            padding: 12px 14px;
            font-family: inherit;
            font-size: 14px;
            outline: none;
        }

        .add-form input:focus {
            border-color: #f59e0b;
            box-shadow: 0 0 0 3px rgba(245,158,11,0.1);
        }

        .add-btn {
            border: none;
            border-radius: 9px;
            background: #f59e0b;
            color: #111827;
            padding: 0 20px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
        }

        .add-btn:hover {
            background: #d97706;
            color: white;
        }

        .empty {
            background: white;
            border: 1px dashed #d1d5db;
            border-radius: 14px;
            padding: 50px 20px;
            text-align: center;
            color: #6b7280;
        }

        .task-item {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 16px 18px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .task-item input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: #f59e0b;
            cursor: pointer;
            flex-shrink: 0;
        }

        .task-title {
            flex: 1;
            font-size: 14px;
            color: #111827;
        }

        .task-title.done {
            text-decoration: line-through;
            color: #9ca3af;
        }

        .delete-btn {
            border: none;
            background: none;
            color: #b91c1c;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }

        .delete-btn:hover {
            text-decoration: underline;
        }

        .status-msg {
            font-size: 13px;
            color: #b91c1c;
        }

        @media (max-width: 560px) {
            .navbar {
                padding: 14px 5%;
                height: auto;
                flex-wrap: wrap;
                gap: 10px;
            }
        }
    </style>
</head>

<body>

<nav class="navbar">
    <div class="logo">
        <div class="logo-box">S</div>
        <strong>SANKALP</strong>
    </div>

    <a class="back-link" href="customer-dashboard.html">← Back to Dashboard</a>
</nav>

<div class="container">

    <div class="heading">
        <h1>Task Tracker</h1>
        <p>Your own checklist for things to sort out — permits, material choices, decisions, anything.</p>
    </div>

    <form class="add-form" id="addForm">
        <input type="text" id="taskInput" placeholder="Add a task..." required>
        <button type="submit" class="add-btn">+ Add</button>
    </form>

    <div id="tasksArea">Loading...</div>

</div>

<script>

    const API_BASE = "https://sankalp-full-web.onrender.com/api";

    const user = JSON.parse(localStorage.getItem("user") || "null");
    const token = localStorage.getItem("token");

    if (!user || !token) {
        window.location.href = "login_page.html";
    }

    async function loadTasks() {
        const area = document.getElementById("tasksArea");

        try {
            const response = await fetch(`${API_BASE}/tasks`, {
                headers: { "Authorization": `Bearer ${token}` }
            });

            const data = await response.json();

            if (!response.ok || !data.success) {
                area.innerHTML = `<p class="status-msg">${data.message || "Failed to load tasks."}</p>`;
                return;
            }

            if (data.tasks.length === 0) {
                area.innerHTML = `<div class="empty"><p>No tasks yet. Add your first one above.</p></div>`;
                return;
            }

            area.innerHTML = "";

            data.tasks.forEach(task => {
                const item = document.createElement("div");
                item.className = "task-item";

                const checkbox = document.createElement("input");
                checkbox.type = "checkbox";
                checkbox.checked = task.done;
                checkbox.addEventListener("change", () => toggleTask(task.id));
                item.appendChild(checkbox);

                const title = document.createElement("span");
                title.className = "task-title" + (task.done ? " done" : "");
                title.textContent = task.title;
                item.appendChild(title);

                const deleteBtn = document.createElement("button");
                deleteBtn.className = "delete-btn";
                deleteBtn.textContent = "Delete";
                deleteBtn.addEventListener("click", () => deleteTask(task.id));
                item.appendChild(deleteBtn);

                area.appendChild(item);
            });

        } catch (error) {
            console.error("Failed to load tasks:", error);
            area.innerHTML = `<p class="status-msg">Could not reach the server.</p>`;
        }
    }

    async function toggleTask(id) {
        try {
            await fetch(`${API_BASE}/tasks/${id}/toggle`, {
                method: "PATCH",
                headers: { "Authorization": `Bearer ${token}` }
            });
            loadTasks();
        } catch (error) {
            console.error("Failed to toggle task:", error);
        }
    }

    async function deleteTask(id) {
        try {
            await fetch(`${API_BASE}/tasks/${id}`, {
                method: "DELETE",
                headers: { "Authorization": `Bearer ${token}` }
            });
            loadTasks();
        } catch (error) {
            console.error("Failed to delete task:", error);
        }
    }

    document.getElementById("addForm").addEventListener("submit", async function(event) {
        event.preventDefault();

        const input = document.getElementById("taskInput");
        const title = input.value.trim();

        if (!title) {
            return;
        }

        try {
            await fetch(`${API_BASE}/tasks`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${token}`
                },
                body: JSON.stringify({ title })
            });

            input.value = "";
            loadTasks();

        } catch (error) {
            console.error("Failed to create task:", error);
        }
    });

    loadTasks();

</script>

</body>
</html>
