<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sankalp | Create Account</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Inter", sans-serif;
            background: #f5f6f8;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
        }

        .signup-wrapper {
            width: 100%;
            max-width: 460px;
            background: #ffffff;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.06);
        }

        .logo {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 30px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: #f59e0b;
            border-radius: 10px;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 20px;
            font-weight: 800;
            color: #111827;
        }

        .logo-text {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 1px;
            color: #111827;
        }

        .signup-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .signup-header h2 {
            font-size: 26px;
            color: #111827;
            margin-bottom: 8px;
        }

        .signup-header p {
            color: #6b7280;
            font-size: 14px;
        }

        /* ROLE SELECTOR */

        .role-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;

            padding: 5px;
            background: #f3f4f6;
            border-radius: 12px;

            margin-bottom: 24px;
        }

        .role-btn {
            border: none;
            background: transparent;

            padding: 12px 5px;

            border-radius: 9px;

            cursor: pointer;

            font-family: inherit;
            font-size: 12px;
            font-weight: 600;

            color: #6b7280;

            transition: 0.25s;
        }

        .role-btn .role-icon {
            display: block;
            font-size: 18px;
            margin-bottom: 5px;
        }

        .role-btn.active {
            background: #ffffff;
            color: #111827;

            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .role-btn.active .role-icon {
            color: #f59e0b;
        }

        /* FORM */

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #374151;

            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            height: 50px;

            border: 1px solid #d1d5db;
            border-radius: 10px;

            padding: 0 16px;

            font-family: inherit;
            font-size: 14px;

            outline: none;

            transition: 0.2s;
        }

        .form-input:focus {
            border-color: #f59e0b;

            box-shadow:
                0 0 0 3px rgba(245,158,11,0.12);
        }

        .signup-btn {
            width: 100%;
            height: 52px;

            border: none;
            border-radius: 10px;

            background: #f59e0b;
            color: #111827;

            font-family: inherit;
            font-size: 14px;
            font-weight: 700;

            cursor: pointer;

            transition: 0.25s;

            margin-top: 6px;
        }

        .signup-btn:hover {
            background: #d97706;
            color: white;
        }

        .login-link {
            text-align: center;
            margin-top: 22px;

            font-size: 13px;
            color: #6b7280;
        }

        .login-link a {
            color: #d97706;
            font-weight: 700;
            text-decoration: none;
        }

        /* MESSAGE */

        .message {
            display: none;

            padding: 12px 15px;

            border-radius: 8px;

            margin-bottom: 18px;

            font-size: 13px;
            font-weight: 500;
        }

        .message.success {
            display: block;
            background: #ecfdf5;
            color: #047857;
            border: 1px solid #a7f3d0;
        }

        .message.error {
            display: block;
            background: #fef2f2;
            color: #b91c1c;
            border: 1px solid #fecaca;
        }
    </style>
</head>

<body>

<div class="signup-wrapper">

    <div class="logo">
        <div class="logo-icon">S</div>
        <div class="logo-text">SANKALP</div>
    </div>

    <div class="signup-header">
        <h2>Create your account</h2>
        <p>Join Sankalp to start managing construction projects.</p>
    </div>

    <div class="role-container">

        <button class="role-btn active" data-role="Customer" onclick="selectRole(this)">
            <span class="role-icon">⌂</span>
            Customer
        </button>

        <button class="role-btn" data-role="Professional" onclick="selectRole(this)">
            <span class="role-icon">🏗</span>
            Professional
        </button>

        <button class="role-btn" data-role="Admin" onclick="selectRole(this)">
            <span class="role-icon">⚙</span>
            Admin
        </button>

    </div>

    <div id="message" class="message"></div>

    <form id="signupForm">

        <div class="form-group">
            <label for="name">Full name</label>
            <input type="text" id="name" class="form-input" placeholder="Enter your full name" required>
        </div>

        <div class="form-group">
            <label for="email">Email address</label>
            <input type="email" id="email" class="form-input" placeholder="Enter your email" required>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" class="form-input" placeholder="Create a password" minlength="6" required>
        </div>

        <button type="submit" class="signup-btn">Create account</button>

    </form>

    <div class="login-link">
        Already have an account?
        <a href="login_page.html">Sign in</a>
    </div>

</div>

<script>

    let selectedRole = "Customer";

    function selectRole(button) {
        document.querySelectorAll(".role-btn").forEach(btn => {
            btn.classList.remove("active");
        });

        button.classList.add("active");
        selectedRole = button.dataset.role;
    }

    function showMessage(text, type) {
        const message = document.getElementById("message");
        message.textContent = text;
        message.className = "message " + type;
    }

    const API_BASE = "http://127.0.0.1:5000/api";

    document
        .getElementById("signupForm")
        .addEventListener("submit", async function(event) {

            event.preventDefault();

            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value.trim();

            if (!name || !email || !password) {
                showMessage("Please fill in all fields.", "error");
                return;
            }

            try {

                const response = await fetch(`${API_BASE}/auth/signup`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ name, email, password, role: selectedRole })
                });

                const data = await response.json();

                if (!response.ok || !data.success) {
                    showMessage(data.message || "Signup failed.", "error");
                    return;
                }

                showMessage("Account created! Redirecting to sign in...", "success");

                setTimeout(() => {
                    window.location.href = "login_page.html";
                }, 1200);

            } catch (error) {
                console.error("Signup request failed:", error);
                showMessage("Could not reach the server. Please try again.", "error");
            }

        });

</script>

</body>
</html>
