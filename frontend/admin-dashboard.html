<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard | Sankalp</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Inter", sans-serif;
            background: #f5f6f8;
            color: #111827;
            min-height: 100vh;
        }

        .navbar {
            height: 72px;
            background: white;
            border-bottom: 1px solid #e5e7eb;

            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 7%;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-box {
            width: 38px;
            height: 38px;
            background: #f59e0b;
            border-radius: 9px;

            display: flex;
            justify-content: center;
            align-items: center;

            font-weight: 800;
            color: #111827;
        }

        .logo strong {
            font-size: 18px;
            letter-spacing: 0.5px;
        }

        .role-tag {
            font-size: 11px;
            font-weight: 700;
            color: #6d28d9;
            background: rgba(139,92,246,0.12);
            padding: 4px 10px;
            border-radius: 20px;
            margin-left: 8px;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .user-name {
            font-size: 14px;
            font-weight: 600;
            color: #374151;
        }

        .logout-btn {
            border: 1px solid #d1d5db;
            background: white;
            border-radius: 8px;
            padding: 9px 16px;
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            color: #374151;
            cursor: pointer;
        }

        .logout-btn:hover {
            background: #f9fafb;
            border-color: #b91c1c;
            color: #b91c1c;
        }

        .container {
            max-width: 1150px;
            margin: 0 auto;
            padding: 45px 20px;
        }

        .welcome h1 {
            font-size: 28px;
            margin-bottom: 6px;
        }

        .welcome p {
            color: #6b7280;
            font-size: 14px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
            margin: 30px 0;
        }

        .stat-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 22px;
        }

        .stat-card .value {
            font-size: 30px;
            font-weight: 800;
        }

        .stat-card .label {
            font-size: 13px;
            color: #6b7280;
            margin-top: 4px;
        }

        .section {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 26px;
            margin-bottom: 30px;
        }

        .section h2 {
            font-size: 18px;
            margin-bottom: 18px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        th {
            text-align: left;
            color: #6b7280;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 0.5px;
            padding: 10px 12px;
            border-bottom: 1px solid #e5e7eb;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #f3f4f6;
            color: #374151;
        }

        .role-pill {
            display: inline-block;
            font-size: 11px;
            font-weight: 700;
            padding: 3px 9px;
            border-radius: 20px;
        }

        .role-pill.Admin {
            background: rgba(139,92,246,0.12);
            color: #6d28d9;
        }

        .role-pill.Customer {
            background: rgba(245,158,11,0.12);
            color: #d97706;
        }

        .role-pill.Professional {
            background: rgba(59,130,246,0.12);
            color: #1e40af;
        }

        .empty-row {
            text-align: center;
            color: #6b7280;
            padding: 30px;
        }

        .status-msg {
            font-size: 13px;
            color: #b91c1c;
            padding: 10px 0;
        }
    </style>
</head>

<body>

<nav class="navbar">
    <div class="logo">
        <div class="logo-box">S</div>
        <strong>SANKALP</strong>
        <span class="role-tag">ADMIN</span>
    </div>

    <div class="nav-right">
        <span class="user-name" id="userName"></span>
        <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
</nav>

<div class="container">

    <div class="welcome">
        <h1 id="welcomeHeading">Welcome back</h1>
        <p>Platform overview — all projects and registered accounts.</p>
    </div>

    <div class="stats">
        <div class="stat-card">
            <div class="value" id="statProjects">0</div>
            <div class="label">Total Projects</div>
        </div>

        <div class="stat-card">
            <div class="value" id="statUsers">0</div>
            <div class="label">Registered Users</div>
        </div>

        <div class="stat-card">
            <div class="value" id="statCustomers">0</div>
            <div class="label">Customers</div>
        </div>

        <div class="stat-card">
            <div class="value" id="statProfessionals">0</div>
            <div class="label">Professionals</div>
        </div>
    </div>

    <div class="section">
        <h2>All Projects</h2>
        <div id="projectsArea"></div>
    </div>

    <div class="section">
        <h2>Registered Users</h2>
        <div id="usersArea"></div>
    </div>

</div>

<script>

    const API_BASE = "http://127.0.0.1:5050/api";

    const user = JSON.parse(localStorage.getItem("user") || "null");
    const token = localStorage.getItem("token");

    if (!user || !token) {
        window.location.href = "login_page.html";
    } else if (user.role !== "Admin") {
        const dashboards = {
            Customer: "customer-dashboard.html",
            Professional: "professional-dashboard.html"
        };
        window.location.href = dashboards[user.role] || "login_page.html";
    }

    function logout() {
        localStorage.removeItem("token");
        localStorage.removeItem("user");
        window.location.href = "login_page.html";
    }

    document.getElementById("userName").textContent = user ? user.name : "";
    document.getElementById("welcomeHeading").textContent = user ? `Welcome back, ${user.name}` : "Welcome back";

    function loadProjects() {
        const projects = JSON.parse(localStorage.getItem("sankalpProjects") || "[]");
        const area = document.getElementById("projectsArea");

        document.getElementById("statProjects").textContent = projects.length;

        if (projects.length === 0) {
            area.innerHTML = `<p class="empty-row">No projects created yet.</p>`;
            return;
        }

        const table = document.createElement("table");

        const thead = document.createElement("thead");
        thead.innerHTML = `
            <tr>
                <th>Project</th>
                <th>Type</th>
                <th>Customer</th>
                <th>Location</th>
                <th>Budget</th>
                <th>Status</th>
            </tr>
        `;
        table.appendChild(thead);

        const tbody = document.createElement("tbody");

        projects.forEach(project => {
            const row = document.createElement("tr");

            [
                project.project_name || "-",
                project.project_type || "-",
                project.customer_name || "-",
                project.location || "-",
                `₹${project.budget || "Not specified"}`,
                project.status || "Planning"
            ].forEach(value => {
                const cell = document.createElement("td");
                cell.textContent = value;
                row.appendChild(cell);
            });

            tbody.appendChild(row);
        });

        table.appendChild(tbody);

        area.innerHTML = "";
        area.appendChild(table);
    }

    async function loadUsers() {
        const area = document.getElementById("usersArea");

        try {
            const response = await fetch(`${API_BASE}/auth/users`, {
                headers: { "Authorization": `Bearer ${token}` }
            });

            const data = await response.json();

            if (!response.ok || !data.success) {
                area.innerHTML = `<p class="status-msg">${data.message || "Failed to load users."}</p>`;
                return;
            }

            const users = data.users;

            document.getElementById("statUsers").textContent = users.length;
            document.getElementById("statCustomers").textContent =
                users.filter(u => u.role === "Customer").length;
            document.getElementById("statProfessionals").textContent =
                users.filter(u => u.role === "Professional").length;

            if (users.length === 0) {
                area.innerHTML = `<p class="empty-row">No registered users yet.</p>`;
                return;
            }

            const table = document.createElement("table");

            const thead = document.createElement("thead");
            thead.innerHTML = `
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Role</th>
                    <th>Joined</th>
                </tr>
            `;
            table.appendChild(thead);

            const tbody = document.createElement("tbody");

            users.forEach(u => {
                const row = document.createElement("tr");

                const nameCell = document.createElement("td");
                nameCell.textContent = u.name;
                row.appendChild(nameCell);

                const emailCell = document.createElement("td");
                emailCell.textContent = u.email;
                row.appendChild(emailCell);

                const roleCell = document.createElement("td");
                const pill = document.createElement("span");
                pill.className = `role-pill ${u.role}`;
                pill.textContent = u.role;
                roleCell.appendChild(pill);
                row.appendChild(roleCell);

                const joinedCell = document.createElement("td");
                joinedCell.textContent = u.created_at;
                row.appendChild(joinedCell);

                tbody.appendChild(row);
            });

            table.appendChild(tbody);

            area.innerHTML = "";
            area.appendChild(table);

        } catch (error) {
            console.error("Failed to load users:", error);
            area.innerHTML = `<p class="status-msg">Could not reach the server.</p>`;
        }
    }

    loadProjects();
    loadUsers();

</script>

</body>
</html>
