<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Coming Soon | Sankalp</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Inter", sans-serif;
            background: #f5f6f8;
            color: #111827;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            padding: 50px 40px;
            text-align: center;
            max-width: 440px;
            width: 100%;
        }

        .icon {
            width: 64px;
            height: 64px;
            background: rgba(245,158,11,0.12);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin: 0 auto 20px;
        }

        h1 {
            font-size: 22px;
            margin-bottom: 10px;
        }

        p {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 26px;
        }

        .back-link {
            display: inline-block;
            background: #f59e0b;
            color: #111827;
            border-radius: 9px;
            padding: 12px 22px;
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
        }

        .back-link:hover {
            background: #d97706;
            color: white;
        }
    </style>
</head>

<body>

<div class="card">
    <div class="icon">🚧</div>
    <h1 id="featureTitle">Coming Soon</h1>
    <p id="featureText">This feature is still being built and isn't available yet.</p>
    <a class="back-link" href="customer-dashboard.html">← Back to Dashboard</a>
</div>

<script>

    const params = new URLSearchParams(window.location.search);
    const feature = params.get("feature");

    if (feature) {
        document.getElementById("featureTitle").textContent = `${feature} — Coming Soon`;
        document.getElementById("featureText").textContent =
            `${feature} isn't built yet, but it's on the roadmap. Check back later!`;
        document.title = `${feature} | Coming Soon`;
    }

</script>

</body>
</html>
