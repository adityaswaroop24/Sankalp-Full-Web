<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Professional Dashboard | Sankalp</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Inter", sans-serif;
            background: #f5f6f8;
            color: #111827;
            min-height: 100vh;
        }

        .navbar {
            height: 72px;
            background: white;
            border-bottom: 1px solid #e5e7eb;

            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 7%;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-box {
            width: 38px;
            height: 38px;
            background: #f59e0b;
            border-radius: 9px;

            display: flex;
            justify-content: center;
            align-items: center;

            font-weight: 800;
            color: #111827;
        }

        .logo strong {
            font-size: 18px;
            letter-spacing: 0.5px;
        }

        .role-tag {
            font-size: 11px;
            font-weight: 700;
            color: #1e40af;
            background: rgba(59,130,246,0.12);
            padding: 4px 10px;
            border-radius: 20px;
            margin-left: 8px;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .user-name {
            font-size: 14px;
            font-weight: 600;
            color: #374151;
        }

        .logout-btn {
            border: 1px solid #d1d5db;
            background: white;
            border-radius: 8px;
            padding: 9px 16px;
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            color: #374151;
            cursor: pointer;
        }

        .logout-btn:hover {
            background: #f9fafb;
            border-color: #b91c1c;
            color: #b91c1c;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 45px 20px;
        }

        .welcome h1 {
            font-size: 28px;
            margin-bottom: 6px;
        }

        .welcome p {
            color: #6b7280;
            font-size: 14px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            margin: 30px 0;
        }

        .stat-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 22px;
        }

        .stat-card .value {
            font-size: 30px;
            font-weight: 800;
        }

        .stat-card .label {
            font-size: 13px;
            color: #6b7280;
            margin-top: 4px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .section-header h2 {
            font-size: 20px;
        }

        .empty {
            background: white;
            border: 1px dashed #d1d5db;
            border-radius: 14px;
            padding: 50px 20px;
            text-align: center;
            color: #6b7280;
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 18px;
        }

        .project-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 22px;
        }

        .project-card h3 {
            font-size: 16px;
            margin-bottom: 10px;
        }

        .badge {
            display: inline-block;
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            margin-bottom: 12px;
            background: #fef3c7;
            color: #92400e;
        }

        .project-detail {
            font-size: 13px;
            color: #4b5563;
            margin-bottom: 6px;
        }

        .contact-btn {
            margin-top: 14px;
            display: inline-block;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            padding: 9px 14px;
            font-size: 13px;
            font-weight: 600;
            color: #374151;
            text-decoration: none;
        }

        .contact-btn:hover {
            border-color: #f59e0b;
            color: #d97706;
        }

        .contact-btn.disabled {
            opacity: 0.5;
            pointer-events: none;
        }
    </style>
</head>

<body>

<nav class="navbar">
    <div class="logo">
        <div class="logo-box">S</div>
        <strong>SANKALP</strong>
        <span class="role-tag">PROFESSIONAL</span>
    </div>

    <div class="nav-right">
        <span class="user-name" id="userName"></span>
        <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
</nav>

<div class="container">

    <div class="welcome">
        <h1 id="welcomeHeading">Welcome back</h1>
        <p>Browse construction projects looking for professionals like you.</p>
    </div>

    <div class="stats">
        <div class="stat-card">
            <div class="value" id="statTotal">0</div>
            <div class="label">Available Projects</div>
        </div>

        <div class="stat-card">
            <div class="value" id="statLocations">0</div>
            <div class="label">Locations</div>
        </div>

        <div class="stat-card">
            <div class="value" id="statBudget">₹0</div>
            <div class="label">Combined Budget</div>
        </div>
    </div>

    <div class="section-header">
        <h2>Available Projects</h2>
    </div>

    <div id="projectsArea"></div>

</div>

<script>

    const user = JSON.parse(localStorage.getItem("user") || "null");
    const token = localStorage.getItem("token");

    if (!user || !token) {
        window.location.href = "login_page.html";
    } else if (user.role !== "Professional") {
        const dashboards = {
            Admin: "admin-dashboard.html",
            Customer: "customer-dashboard.html"
        };
        window.location.href = dashboards[user.role] || "login_page.html";
    }

    function logout() {
        localStorage.removeItem("token");
        localStorage.removeItem("user");
        window.location.href = "login_page.html";
    }

    document.getElementById("userName").textContent = user ? user.name : "";
    document.getElementById("welcomeHeading").textContent = user ? `Welcome back, ${user.name}` : "Welcome back";

    function loadProjects() {
        const projects = JSON.parse(localStorage.getItem("sankalpProjects") || "[]");
        const area = document.getElementById("projectsArea");

        document.getElementById("statTotal").textContent = projects.length;

        const uniqueLocations = new Set(
            projects.map(p => (p.location || "").trim().toLowerCase()).filter(Boolean)
        );
        document.getElementById("statLocations").textContent = uniqueLocations.size;

        const combinedBudget = projects.reduce((sum, p) => sum + (Number(p.budget) || 0), 0);
        document.getElementById("statBudget").textContent = `₹${combinedBudget.toLocaleString("en-IN")}`;

        if (projects.length === 0) {
            area.innerHTML = `
                <div class="empty">
                    <p>No projects are available right now. Check back later.</p>
                </div>
            `;
            return;
        }

        const grid = document.createElement("div");
        grid.className = "projects-grid";

        projects.forEach(project => {
            const card = document.createElement("div");
            card.className = "project-card";

            const badge = document.createElement("span");
            badge.className = "badge";
            badge.textContent = project.status || "Planning";
            card.appendChild(badge);

            const title = document.createElement("h3");
            title.textContent = project.project_name || "Untitled Project";
            card.appendChild(title);

            [
                `Type: ${project.project_type || "-"}`,
                `Location: ${project.location || "-"}`,
                `Budget: ₹${project.budget || "Not specified"}`,
                `Preferred Contact: ${project.preferred_contact || "-"}`
            ].forEach(text => {
                const detail = document.createElement("div");
                detail.className = "project-detail";
                detail.textContent = text;
                card.appendChild(detail);
            });

            const contactBtn = document.createElement("a");
            contactBtn.textContent = "Contact Customer";
            contactBtn.className = "contact-btn" + (project.email ? "" : " disabled");
            contactBtn.href = project.email ? `mailto:${project.email}` : "#";

            card.appendChild(contactBtn);

            grid.appendChild(card);
        });

        area.innerHTML = "";
        area.appendChild(grid);
    }

    loadProjects();

</script>

</body>
</html>
