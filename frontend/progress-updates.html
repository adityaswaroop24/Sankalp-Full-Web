<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Progress Updates | Sankalp</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Inter", sans-serif;
            background: #f5f6f8;
            color: #111827;
            min-height: 100vh;
        }

        .navbar {
            height: 72px;
            background: white;
            border-bottom: 1px solid #e5e7eb;

            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 7%;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-box {
            width: 38px;
            height: 38px;
            background: #f59e0b;
            border-radius: 9px;

            display: flex;
            justify-content: center;
            align-items: center;

            font-weight: 800;
            color: #111827;
        }

        .logo strong {
            font-size: 18px;
            letter-spacing: 0.5px;
        }

        .back-link {
            font-size: 13px;
            font-weight: 600;
            color: #6b7280;
            text-decoration: none;
        }

        .back-link:hover {
            color: #d97706;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 45px 20px;
        }

        .welcome h1 {
            font-size: 28px;
            margin-bottom: 6px;
        }

        .welcome p {
            color: #6b7280;
            font-size: 14px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            margin: 30px 0;
        }

        .stat-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 22px;
        }

        .stat-card .value {
            font-size: 30px;
            font-weight: 800;
        }

        .stat-card .label {
            font-size: 13px;
            color: #6b7280;
            margin-top: 4px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .section-header h2 {
            font-size: 20px;
        }

        .cta-btn {
            background: #f59e0b;
            color: #111827;
            border: none;
            border-radius: 9px;
            padding: 12px 20px;
            font-family: inherit;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        .cta-btn:hover {
            background: #d97706;
            color: white;
        }

        .empty {
            background: white;
            border: 1px dashed #d1d5db;
            border-radius: 14px;
            padding: 50px 20px;
            text-align: center;
            color: #6b7280;
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 18px;
        }

        .project-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 22px;
        }

        .project-card h3 {
            font-size: 16px;
            margin-bottom: 10px;
        }

        .badge {
            display: inline-block;
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            margin-bottom: 12px;
        }

        .badge.planning {
            background: #fef3c7;
            color: #92400e;
        }

        .badge.progress {
            background: #dbeafe;
            color: #1e40af;
        }

        .badge.completed {
            background: #d1fae5;
            color: #065f46;
        }

        .project-detail {
            font-size: 13px;
            color: #4b5563;
            margin-bottom: 6px;
        }

        .progress-bar-track {
            height: 8px;
            background: #f3f4f6;
            border-radius: 20px;
            margin-top: 12px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: #f59e0b;
            border-radius: 20px;
        }

        .card-actions {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }

        .action-btn {
            flex: 1;
            border: 1px solid #d1d5db;
            background: white;
            border-radius: 8px;
            padding: 8px 0;
            font-family: inherit;
            font-size: 12px;
            font-weight: 700;
            color: #374151;
            cursor: pointer;
        }

        .action-btn.edit:hover {
            border-color: #f59e0b;
            color: #d97706;
        }

        .action-btn.delete:hover {
            border-color: #b91c1c;
            color: #b91c1c;
        }

        .status-msg {
            font-size: 13px;
            color: #b91c1c;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(17,24,39,0.5);
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 100;
        }

        .modal-overlay.visible {
            display: flex;
        }

        .modal-card {
            background: white;
            border-radius: 16px;
            padding: 28px;
            max-width: 480px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-card h2 {
            font-size: 18px;
            margin-bottom: 18px;
        }

        .field {
            margin-bottom: 16px;
        }

        .field label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #374151;
        }

        .field input, .field select, .field textarea {
            width: 100%;
            border: 1px solid #d1d5db;
            border-radius: 9px;
            padding: 11px 12px;
            font-family: inherit;
            font-size: 14px;
            outline: none;
        }

        .field textarea {
            min-height: 80px;
            resize: vertical;
        }

        .field input:focus, .field select:focus, .field textarea:focus {
            border-color: #f59e0b;
            box-shadow: 0 0 0 3px rgba(245,158,11,0.1);
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 8px;
        }

        .modal-cancel {
            flex: 1;
            border: 1px solid #d1d5db;
            background: white;
            border-radius: 9px;
            padding: 12px 0;
            font-family: inherit;
            font-size: 13px;
            font-weight: 700;
            color: #374151;
            cursor: pointer;
        }

        .modal-cancel:hover {
            background: #f9fafb;
        }

        .modal-save {
            flex: 1;
            border: none;
            border-radius: 9px;
            background: #f59e0b;
            color: #111827;
            padding: 12px 0;
            font-family: inherit;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
        }

        .modal-save:hover {
            background: #d97706;
            color: white;
        }

        @media (max-width: 640px) {

            .navbar {
                height: auto;
                flex-wrap: wrap;
                gap: 10px;
                padding: 14px 5%;
            }

            .logo strong {
                font-size: 15px;
            }

            .container {
                padding: 30px 16px;
            }

            .welcome h1 {
                font-size: 22px;
            }

            .stats {
                grid-template-columns: 1fr 1fr;
                gap: 12px;
            }

            .stat-card {
                padding: 16px;
            }

            .stat-card .value {
                font-size: 24px;
            }

            .section-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }

            .cta-btn {
                width: 100%;
                text-align: center;
            }
        }

        @media (max-width: 400px) {

            .stats {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<nav class="navbar">
    <div class="logo">
        <div class="logo-box">S</div>
        <strong>SANKALP</strong>
    </div>

    <a class="back-link" href="customer-dashboard.html">← Back to Dashboard</a>
</nav>

<div class="container">

    <div class="welcome">
        <h1>Progress Updates</h1>
        <p>Track the status of every project you've started.</p>
    </div>

    <div class="stats">
        <div class="stat-card">
            <div class="value" id="statTotal">0</div>
            <div class="label">Total Projects</div>
        </div>

        <div class="stat-card">
            <div class="value" id="statProgress">0</div>
            <div class="label">In Progress</div>
        </div>

        <div class="stat-card">
            <div class="value" id="statCompleted">0</div>
            <div class="label">Completed</div>
        </div>
    </div>

    <div class="section-header">
        <h2>My Projects</h2>
        <a class="cta-btn" href="start-project.html">+ Start New Project</a>
    </div>

    <div id="projectsArea"></div>

</div>

<div class="modal-overlay" id="editModalOverlay">
    <div class="modal-card">
        <h2>Edit Project</h2>

        <div id="editStatus" class="status-msg" style="margin-bottom: 12px;"></div>

        <form id="editForm">
            <div class="field">
                <label>Project Name *</label>
                <input type="text" id="editProjectName" required>
            </div>

            <div class="field">
                <label>Project Type *</label>
                <select id="editProjectType" required>
                    <option value="Residential House">Residential House</option>
                    <option value="Apartment">Apartment</option>
                    <option value="Villa">Villa</option>
                    <option value="Renovation">Renovation</option>
                    <option value="Commercial">Commercial Building</option>
                </select>
            </div>

            <div class="field">
                <label>Estimated Budget</label>
                <input type="number" id="editBudget">
            </div>

            <div class="field">
                <label>Expected Completion</label>
                <input type="date" id="editCompletion">
            </div>

            <div class="field">
                <label>Project Location *</label>
                <input type="text" id="editLocation" required>
            </div>

            <div class="field">
                <label>Project Description</label>
                <textarea id="editDescription"></textarea>
            </div>

            <div class="modal-actions">
                <button type="button" class="modal-cancel" id="editCancelBtn">Cancel</button>
                <button type="submit" class="modal-save">Save Changes</button>
            </div>
        </form>
    </div>
</div>

<script>

    const API_BASE = "https://sankalp-full-web.onrender.com/api";

    const user = JSON.parse(localStorage.getItem("user") || "null");
    const token = localStorage.getItem("token");

    if (!user || !token) {
        window.location.href = "login_page.html";
    }

    function badgeClass(status) {
        if (status === "Completed") return "completed";
        if (status === "In Progress") return "progress";
        return "planning";
    }

    async function loadProjects() {
        const area = document.getElementById("projectsArea");

        let projects = [];

        try {
            const response = await fetch(`${API_BASE}/projects/mine`, {
                headers: { "Authorization": `Bearer ${token}` }
            });

            const data = await response.json();

            if (!response.ok || !data.success) {
                area.innerHTML = `<div class="empty"><p>${data.message || "Failed to load projects."}</p></div>`;
                return;
            }

            projects = data.projects;

        } catch (error) {
            console.error("Failed to load projects:", error);
            area.innerHTML = `<div class="empty"><p>Could not reach the server.</p></div>`;
            return;
        }

        document.getElementById("statTotal").textContent = projects.length;
        document.getElementById("statProgress").textContent =
            projects.filter(p => p.status === "In Progress").length;
        document.getElementById("statCompleted").textContent =
            projects.filter(p => p.status === "Completed").length;

        if (projects.length === 0) {
            area.innerHTML = `
                <div class="empty">
                    <p>You haven't started any projects yet.</p>
                </div>
            `;
            return;
        }

        const grid = document.createElement("div");
        grid.className = "projects-grid";

        projects.forEach(project => {
            const status = project.status || "Planning";
            const progress = project.progress || 0;

            const card = document.createElement("div");
            card.className = "project-card";

            const badge = document.createElement("span");
            badge.className = `badge ${badgeClass(status)}`;
            badge.textContent = status;
            card.appendChild(badge);

            const title = document.createElement("h3");
            title.textContent = project.project_name || "Untitled Project";
            card.appendChild(title);

            [
                `Type: ${project.project_type || "-"}`,
                `Location: ${project.location || "-"}`,
                `Budget: ₹${project.budget || "Not specified"}`
            ].forEach(text => {
                const detail = document.createElement("div");
                detail.className = "project-detail";
                detail.textContent = text;
                card.appendChild(detail);
            });

            const track = document.createElement("div");
            track.className = "progress-bar-track";

            const fill = document.createElement("div");
            fill.className = "progress-bar-fill";
            fill.style.width = `${progress}%`;

            track.appendChild(fill);
            card.appendChild(track);

            const actions = document.createElement("div");
            actions.className = "card-actions";

            const editBtn = document.createElement("button");
            editBtn.className = "action-btn edit";
            editBtn.textContent = "Edit";
            editBtn.addEventListener("click", () => openEditModal(project));
            actions.appendChild(editBtn);

            const deleteBtn = document.createElement("button");
            deleteBtn.className = "action-btn delete";
            deleteBtn.textContent = "Delete";
            deleteBtn.addEventListener("click", () => deleteProject(project.id));
            actions.appendChild(deleteBtn);

            card.appendChild(actions);

            grid.appendChild(card);
        });

        area.innerHTML = "";
        area.appendChild(grid);
    }

    let editingProjectId = null;

    function openEditModal(project) {
        editingProjectId = project.id;

        document.getElementById("editProjectName").value = project.project_name || "";
        document.getElementById("editProjectType").value = project.project_type || "Residential House";
        document.getElementById("editBudget").value = project.budget || "";
        document.getElementById("editCompletion").value = project.completion_date || "";
        document.getElementById("editLocation").value = project.location || "";
        document.getElementById("editDescription").value = project.description || "";

        document.getElementById("editStatus").textContent = "";
        document.getElementById("editModalOverlay").classList.add("visible");
    }

    function closeEditModal() {
        editingProjectId = null;
        document.getElementById("editModalOverlay").classList.remove("visible");
    }

    document.getElementById("editCancelBtn").addEventListener("click", closeEditModal);

    document.getElementById("editModalOverlay").addEventListener("click", (event) => {
        if (event.target.id === "editModalOverlay") {
            closeEditModal();
        }
    });

    document.getElementById("editForm").addEventListener("submit", async function(event) {
        event.preventDefault();

        const editStatus = document.getElementById("editStatus");

        const payload = {
            projectName: document.getElementById("editProjectName").value.trim(),
            projectType: document.getElementById("editProjectType").value,
            budget: document.getElementById("editBudget").value,
            completion: document.getElementById("editCompletion").value,
            location: document.getElementById("editLocation").value.trim(),
            description: document.getElementById("editDescription").value.trim()
        };

        try {
            const response = await fetch(`${API_BASE}/projects/${editingProjectId}`, {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${token}`
                },
                body: JSON.stringify(payload)
            });

            const data = await response.json();

            if (!response.ok || !data.success) {
                editStatus.textContent = data.message || "Failed to update project.";
                return;
            }

            closeEditModal();
            loadProjects();

        } catch (error) {
            console.error("Update project failed:", error);
            editStatus.textContent = "Could not reach the server.";
        }
    });

    async function deleteProject(id) {
        if (!confirm("Delete this project? This cannot be undone.")) {
            return;
        }

        try {
            await fetch(`${API_BASE}/projects/${id}`, {
                method: "DELETE",
                headers: { "Authorization": `Bearer ${token}` }
            });
            loadProjects();
        } catch (error) {
            console.error("Delete project failed:", error);
        }
    }

    loadProjects();

</script>

</body>
</html>
