<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | Sankalp</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Inter", sans-serif;
            background: #f5f6f8;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
        }

        .card {
            width: 100%;
            max-width: 440px;
            background: #ffffff;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.06);
        }

        .logo {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 28px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: #3b82f6;
            border-radius: 10px;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 20px;
            font-weight: 800;
            color: white;
        }

        .logo-text {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 1px;
            color: #111827;
        }

        h2 {
            font-size: 24px;
            color: #111827;
            margin-bottom: 8px;
            text-align: center;
        }

        p.subtitle {
            color: #6b7280;
            font-size: 14px;
            text-align: center;
            margin-bottom: 26px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            height: 50px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            padding: 0 16px;
            font-family: inherit;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
        }

        .form-input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.12);
        }

        .submit-btn {
            width: 100%;
            height: 52px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            font-family: inherit;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.25s;
        }

        .submit-btn:hover {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .back-link {
            text-align: center;
            margin-top: 22px;
            font-size: 13px;
            color: #6b7280;
        }

        .back-link a {
            color: #2563eb;
            font-weight: 700;
            text-decoration: none;
        }

        .message {
            display: none;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 18px;
            font-size: 13px;
            font-weight: 500;
        }

        .message.success {
            display: block;
            background: #ecfdf5;
            color: #047857;
            border: 1px solid #a7f3d0;
        }

        .message.error {
            display: block;
            background: #fef2f2;
            color: #b91c1c;
            border: 1px solid #fecaca;
        }

        @media (max-width: 400px) {

            .card {
                padding: 28px 20px;
            }

            h2 {
                font-size: 21px;
            }
        }
    </style>
</head>

<body>

<div class="card">

    <div class="logo">
        <div class="logo-icon">S</div>
        <div class="logo-text">SANKALP</div>
    </div>

    <h2>Forgot your password?</h2>
    <p class="subtitle">Enter your account email and we'll send you a reset link.</p>

    <div id="message" class="message"></div>

    <form id="forgotForm">

        <div class="form-group">
            <label for="email">Email address</label>
            <input type="email" id="email" class="form-input" placeholder="Enter your email" required>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">Send Reset Link</button>

    </form>

    <div class="back-link">
        Remembered it? <a href="login_page.html">Back to sign in</a>
    </div>

</div>

<script>

    const API_BASE = "https://sankalp-full-web.onrender.com/api";

    function showMessage(text, type) {
        const message = document.getElementById("message");
        message.textContent = text;
        message.className = "message " + type;
    }

    document
        .getElementById("forgotForm")
        .addEventListener("submit", async function(event) {

            event.preventDefault();

            const email = document.getElementById("email").value.trim();
            const submitBtn = document.getElementById("submitBtn");

            if (!email) {
                showMessage("Please enter your email.", "error");
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = "Sending...";

            try {

                const response = await fetch(`${API_BASE}/auth/forgot-password`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email })
                });

                const data = await response.json();

                showMessage(
                    data.message || "If an account exists for that email, a reset link has been sent.",
                    data.success ? "success" : "error"
                );

            } catch (error) {
                console.error("Forgot password request failed:", error);
                showMessage("Could not reach the server. Please try again.", "error");
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = "Send Reset Link";
            }

        });

</script>

</body>
</html>
