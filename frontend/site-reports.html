<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Site Reports | Sankalp</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Inter", sans-serif;
            background: #f5f6f8;
            color: #111827;
            min-height: 100vh;
        }

        .navbar {
            height: 72px;
            background: white;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 7%;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-box {
            width: 38px;
            height: 38px;
            background: #3b82f6;
            border-radius: 9px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 800;
            color: white;
        }

        .logo strong {
            font-size: 18px;
            letter-spacing: 0.5px;
        }

        .back-link {
            font-size: 13px;
            font-weight: 600;
            color: #6b7280;
            text-decoration: none;
        }

        .back-link:hover {
            color: #2563eb;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 45px 20px;
        }

        .heading h1 {
            font-size: 26px;
            margin-bottom: 6px;
        }

        .heading p {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 22px;
        }

        .stat-card .value {
            font-size: 26px;
            font-weight: 800;
        }

        .stat-card .label {
            font-size: 13px;
            color: #6b7280;
            margin-top: 4px;
        }

        .empty {
            background: white;
            border: 1px dashed #d1d5db;
            border-radius: 14px;
            padding: 50px 20px;
            text-align: center;
            color: #6b7280;
        }

        .report-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 22px;
            margin-bottom: 16px;
        }

        .report-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
            gap: 10px;
            flex-wrap: wrap;
        }

        .report-top h3 {
            font-size: 16px;
        }

        .report-date {
            font-size: 12px;
            color: #6b7280;
            font-weight: 600;
        }

        .report-detail {
            font-size: 13px;
            color: #4b5563;
            margin-bottom: 6px;
        }

        .report-summary {
            font-size: 13px;
            color: #374151;
            margin-top: 10px;
            line-height: 1.5;
        }

        .status-msg {
            font-size: 13px;
            color: #b91c1c;
        }

        @media (max-width: 560px) {
            .navbar {
                padding: 14px 5%;
                height: auto;
                flex-wrap: wrap;
                gap: 10px;
            }

            .stats {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<nav class="navbar">
    <div class="logo">
        <div class="logo-box">S</div>
        <strong>SANKALP</strong>
    </div>

    <a class="back-link" href="customer-dashboard.html">← Back to Dashboard</a>
</nav>

<div class="container">

    <div class="heading">
        <h1>Site Reports</h1>
        <p>Daily updates your contractor has filed for your projects.</p>
    </div>

    <div class="stats">
        <div class="stat-card">
            <div class="value" id="statCount">0</div>
            <div class="label">Reports Filed</div>
        </div>

        <div class="stat-card">
            <div class="value" id="statSpent">₹0</div>
            <div class="label">Total Spent Logged</div>
        </div>
    </div>

    <div id="reportsArea">Loading...</div>

</div>

<script>

    const API_BASE = "https://sankalp-full-web.onrender.com/api";

    const user = JSON.parse(localStorage.getItem("user") || "null");
    const token = localStorage.getItem("token");

    if (!user || !token) {
        window.location.href = "login_page.html";
    }

    function formatDate(dateStr) {
        return new Date(dateStr).toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" });
    }

    async function loadReports() {
        const area = document.getElementById("reportsArea");

        try {
            const response = await fetch(`${API_BASE}/reports/customer`, {
                headers: { "Authorization": `Bearer ${token}` }
            });

            const data = await response.json();

            if (!response.ok || !data.success) {
                area.innerHTML = `<p class="status-msg">${data.message || "Failed to load reports."}</p>`;
                return;
            }

            const reports = data.reports;

            document.getElementById("statCount").textContent = reports.length;

            const totalSpent = reports.reduce((sum, r) => sum + (Number(r.amountSpent) || 0), 0);
            document.getElementById("statSpent").textContent = `₹${totalSpent.toLocaleString("en-IN")}`;

            if (reports.length === 0) {
                area.innerHTML = `<div class="empty"><p>No site reports yet. Once your contractor submits one, it'll show up here.</p></div>`;
                return;
            }

            area.innerHTML = "";

            reports.forEach(report => {
                const card = document.createElement("div");
                card.className = "report-card";

                const top = document.createElement("div");
                top.className = "report-top";

                const title = document.createElement("h3");
                title.textContent = report.projectName;
                top.appendChild(title);

                const date = document.createElement("span");
                date.className = "report-date";
                date.textContent = formatDate(report.reportDate);
                top.appendChild(date);

                card.appendChild(top);

                [
                    `Submitted by: ${report.professionalName}`,
                    `Amount spent: ₹${Number(report.amountSpent).toLocaleString("en-IN")}`,
                    report.daysElapsed !== null ? `Days elapsed: ${report.daysElapsed}` : null
                ].filter(Boolean).forEach(text => {
                    const detail = document.createElement("div");
                    detail.className = "report-detail";
                    detail.textContent = text;
                    card.appendChild(detail);
                });

                const summary = document.createElement("div");
                summary.className = "report-summary";
                summary.textContent = report.workSummary;
                card.appendChild(summary);

                area.appendChild(card);
            });

        } catch (error) {
            console.error("Failed to load reports:", error);
            area.innerHTML = `<p class="status-msg">Could not reach the server.</p>`;
        }
    }

    loadReports();

</script>

</body>
</html>
