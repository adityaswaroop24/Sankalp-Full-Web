<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contractors | Sankalp</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Inter", sans-serif;
            background: #f5f6f8;
            color: #111827;
            min-height: 100vh;
        }

        .navbar {
            height: 72px;
            background: white;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 7%;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-box {
            width: 38px;
            height: 38px;
            background: #f59e0b;
            border-radius: 9px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 800;
            color: #111827;
        }

        .logo strong {
            font-size: 18px;
            letter-spacing: 0.5px;
        }

        .back-link {
            font-size: 13px;
            font-weight: 600;
            color: #6b7280;
            text-decoration: none;
        }

        .back-link:hover {
            color: #d97706;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 45px 20px;
        }

        .heading h1 {
            font-size: 26px;
            margin-bottom: 6px;
        }

        .heading p {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .empty {
            background: white;
            border: 1px dashed #d1d5db;
            border-radius: 14px;
            padding: 50px 20px;
            text-align: center;
            color: #6b7280;
        }

        .contractor-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 22px;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .avatar {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: rgba(59,130,246,0.12);
            color: #1e40af;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 16px;
            flex-shrink: 0;
        }

        .contractor-info {
            flex: 1;
            min-width: 180px;
        }

        .contractor-info h3 {
            font-size: 16px;
            margin-bottom: 4px;
        }

        .contractor-info span {
            font-size: 13px;
            color: #6b7280;
        }

        .reports-pill {
            font-size: 11px;
            font-weight: 700;
            color: #1e40af;
            background: rgba(59,130,246,0.1);
            padding: 4px 10px;
            border-radius: 20px;
            white-space: nowrap;
        }

        .contact-btn {
            border: 1px solid #d1d5db;
            border-radius: 8px;
            padding: 9px 16px;
            font-size: 13px;
            font-weight: 600;
            color: #374151;
            text-decoration: none;
            white-space: nowrap;
        }

        .contact-btn:hover {
            border-color: #f59e0b;
            color: #d97706;
        }

        .status-msg {
            font-size: 13px;
            color: #b91c1c;
        }

        @media (max-width: 560px) {
            .navbar {
                padding: 14px 5%;
                height: auto;
                flex-wrap: wrap;
                gap: 10px;
            }

            .contractor-card {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>

<nav class="navbar">
    <div class="logo">
        <div class="logo-box">S</div>
        <strong>SANKALP</strong>
    </div>

    <a class="back-link" href="customer-dashboard.html">← Back to Dashboard</a>
</nav>

<div class="container">

    <div class="heading">
        <h1>List of Contractors</h1>
        <p>Professionals registered on Sankalp. "Reports filed" reflects how active they've been logging site updates.</p>
    </div>

    <div id="contractorsArea">Loading...</div>

</div>

<script>

    const API_BASE = "https://sankalp-full-web.onrender.com/api";

    const user = JSON.parse(localStorage.getItem("user") || "null");
    const token = localStorage.getItem("token");

    if (!user || !token) {
        window.location.href = "login_page.html";
    }

    async function loadContractors() {
        const area = document.getElementById("contractorsArea");

        try {
            const response = await fetch(`${API_BASE}/auth/contractors`, {
                headers: { "Authorization": `Bearer ${token}` }
            });

            const data = await response.json();

            if (!response.ok || !data.success) {
                area.innerHTML = `<p class="status-msg">${data.message || "Failed to load contractors."}</p>`;
                return;
            }

            if (data.contractors.length === 0) {
                area.innerHTML = `<div class="empty"><p>No professionals have registered yet.</p></div>`;
                return;
            }

            area.innerHTML = "";

            data.contractors.forEach(contractor => {
                const card = document.createElement("div");
                card.className = "contractor-card";

                const avatar = document.createElement("div");
                avatar.className = "avatar";
                avatar.textContent = contractor.name.charAt(0).toUpperCase();
                card.appendChild(avatar);

                const info = document.createElement("div");
                info.className = "contractor-info";

                const name = document.createElement("h3");
                name.textContent = contractor.name;
                info.appendChild(name);

                const email = document.createElement("span");
                email.textContent = contractor.email;
                info.appendChild(email);

                card.appendChild(info);

                const pill = document.createElement("span");
                pill.className = "reports-pill";
                pill.textContent = `${contractor.reportsFiled} report${contractor.reportsFiled === 1 ? "" : "s"} filed`;
                card.appendChild(pill);

                const contactBtn = document.createElement("a");
                contactBtn.className = "contact-btn";
                contactBtn.textContent = "Contact";
                contactBtn.href = `mailto:${contractor.email}`;
                card.appendChild(contactBtn);

                area.appendChild(card);
            });

        } catch (error) {
            console.error("Failed to load contractors:", error);
            area.innerHTML = `<p class="status-msg">Could not reach the server.</p>`;
        }
    }

    loadContractors();

</script>

</body>
</html>
